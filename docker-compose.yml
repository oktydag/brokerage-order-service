services:
  brokerage-order-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: brokerage-order-service:local
    container_name: brokerage-order-service
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      APP_DEMODATA_ENABLED: "true"
      APP_IDEMPOTENCY_RETENTION: "P1D"
      LOGGING_LEVEL_COM_BROKERAGE: "INFO"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
