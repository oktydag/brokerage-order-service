apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: brokerage-stage

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
  - path: secret-patch.yaml

images:
  - name: registry.example.com/brokerage-order-service
    newTag: stage-latest
